<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>简历风格转换器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
            color: #1e293b;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: #334155;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            background: #f8fafc;
            transition: border 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #6366f1;
            background: white;
        }
        .type-group {
            display: flex;
            gap: 12px;
            margin: 20px 0 18px;
            flex-wrap: wrap;
        }
        .type-btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 8px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .type-btn.active {
            border-color: #6366f1;
            background: #eef2ff;
            color: #4338ca;
        }
        .convert-btn {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin: 10px 0 20px;
            transition: background 0.2s;
        }
        .convert-btn:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
        }
        .result-box {
            background: #f8fafc;
            border-radius: 14px;
            padding: 18px;
            border: 1px solid #e2e8f0;
            min-height: 120px;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #1e293b;
        }
        .warning {
            margin-top: 14px;
            font-size: 12px;
            color: #dc2626;
            background: #fef2f2;
            padding: 10px 14px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 简历风格转换器</h1>
        <div class="subtitle">根据目标公司类型，AI 帮你改写简历风格</div>

        <label>📝 粘贴你的原始简历</label>
        <textarea id="resumeInput" placeholder="例如：&#10;张三，3年产品经理经验，负责过XX APP的迭代，沟通能力强..."></textarea>

        <label style="margin-top:16px;">🎯 选择目标公司类型</label>
        <div class="type-group" id="typeGroup">
            <div class="type-btn active" data-type="互联网大厂">💻 互联网大厂</div>
            <div class="type-btn" data-type="外企">🌍 外企</div>
            <div class="type-btn" data-type="国企/央企">🏛 国企/央企</div>
        </div>

        <button class="convert-btn" id="convertBtn">✨ 开始转换风格</button>

        <label>✅ 转换结果</label>
        <div class="result-box" id="resultBox">等待转换…</div>

        <div class="warning">
            ⚠️ 重要提醒：AI生成内容仅供参考，请务必核对修改，确保所有经历、数据真实准确。
        </div>
    </div>

    <script>
        // ========== 换成你的阿里云百炼 API Key ==========
        const API_KEY = 'sk-10430523b49b41a3b122e279b21e78fe';
        const API_URL = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';

        // 类型切换 UI
        const typeBtns = document.querySelectorAll('.type-btn');
        let selectedType = '互联网大厂';
        typeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                typeBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedType = this.dataset.type;
            });
        });

        // 转换逻辑
        document.getElementById('convertBtn').addEventListener('click', async function() {
            const resumeText = document.getElementById('resumeInput').value.trim();
            if (!resumeText) {
                alert('请先粘贴简历内容');
                return;
            }
            if (API_KEY === '你的阿里云百炼Key粘贴在这里') {
                alert('请先替换代码中的 API Key');
                return;
            }

            const btn = this;
            btn.disabled = true;
            btn.textContent = '⏳ AI 正在改写...';
            const resultBox = document.getElementById('resultBox');
            resultBox.textContent = '处理中，请稍候...';

            try {
                const prompt = getPrompt(resumeText, selectedType);
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'qwen-turbo',
                        messages: [
                            { role: 'system', content: '你是一位专业的简历优化专家，擅长根据企业文化和招聘偏好改写简历。你的回答必须是改写后的简历全文，不要有多余的解释或前缀。' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    resultBox.textContent = data.choices[0].message.content;
                } else {
                    resultBox.textContent = '转换失败，请稍后重试。' + (data.error ? ' 错误信息：' + data.error.message : '');
                }
            } catch (error) {
                resultBox.textContent = '网络错误或请求超时，请检查网络。';
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.textContent = '✨ 开始转换风格';
            }
        });

        function getPrompt(resume, type) {
            const typeGuides = {
                '互联网大厂': '请将以下简历改写为适合互联网大厂（如字节、腾讯、阿里）的风格：突出数据驱动、量化成果（如提升百分比、DAU、ROI等）、使用敏捷/迭代/闭环等术语、强调项目影响力和技术深度。将经历重构为 STAR 法则，动词要强有力（主导、推动、从0到1搭建）。',
                '外企': '请将以下简历改写为适合外企（如微软、宝洁、四大）的风格：使用中英双语关键词（关键术语加英文注释）、突出领导力、跨文化协作、结果导向和全球视野。采用STAR法则，强调创新、主动性和影响力。语气专业自信，可包含国际项目经历。',
                '国企/央企': '请将以下简历改写为适合国企/央企的风格：突出学历背景、专业对口、政治面貌（如果是党员请保留）、获奖荣誉、稳定性。语言严谨、规范，避免夸张词汇，强调团队协作、流程优化、合规意识和大型项目经验。教育背景和证书板块应放在显著位置。'
            };
            return `${typeGuides[type]}\n\n原始简历：\n${resume}\n\n请输出改写后的完整简历。`;
        }
    </script>
</body>
</html>
